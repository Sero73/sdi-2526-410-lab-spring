<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head"><title>Editar Departamento</title></head>
<body>

<!-- Barra de Navegación superior -->
<nav th:replace="fragments/nav"></nav>

<div class="container">
    <h2>Editar Departamento</h2>
    <div class="container" id="main-container">
        <h2>Editar Departamento</h2>
        <form class="form-horizontal" method="post" th:action="${'/department/edit/'+department.id}">
            <div class="form-group">
                <label class="control-label col-sm-2" for="code">Codigo:</label>
                <div class="col-sm-10">
                    <input th:value="${department.code}" id="code" type="text" class="form-control" name="code"
                           placeholder="Inf-01" required/>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-2" for="name">Nombre:</label>
                <div class="col-sm-10">
                    <input th:value="${department.name}" id="name" type="text" class="form-control" name="name"
                           placeholder="Informatica" required/>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-2" for="faculty">Facultad:</label>
                <div class="col-sm-10">
                    <input th:value="${department.faculty}" id="faculty" type="text" class="form-control" name="faculty"
                           placeholder="Informatica2" required/>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-2" for="phone">Telefono:</label>
                <div class="col-sm-10">
                    <input th:value="${department.phone}" id="phone" type="text" class="form-control" name="phone"
                           placeholder="32425352" required/>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-2" for="professors">Profesores:</label>
                <div class="col-sm-10">
                    <input th:value="${department.professors}" id="professors" type="text" class="form-control" name="professors"
                           placeholder="professors" required/>
                </div>
            </div>
            <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                    <button type="submit" class="btn btn-primary">Modificar</button>
                </div>
            </div>
        </form>
    </div>
</div>
<footer th:replace="fragments/footer"></footer>
</body>
</html>
