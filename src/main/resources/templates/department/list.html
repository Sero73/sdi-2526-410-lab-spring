<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head"><title>Lista Departamentos</title></head>
<body>
<nav th:replace="fragments/nav"></nav>
<div class="container" id="main-container">
    <h2>Departamentos</h2>
    <p>Los Departamentos que actualmente figuran en el sistema son los siguientes:</p>
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th scope="col">Codigo</th>
                <th scope="col">Nombre</th>
                <th scope="col">Facultad</th>
                <th scope="col">Telefono</th>
                <th scope="col">Profesores</th>
                <th scope="col"></th>
                <th scope="col"></th>
                <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="department : ${departmentsList}">
                <td scope="row" th:text="${department.code}"> Inf-01</td>
                <td th:text="${department.name}"> Informatica</td>
                <td th:text="${department.faculty}">Facultad</td>
                <td th:text="${department.phone}">343256</td>
                <td th:text="${department.professors}">5</td>
                <td><a th:href="${'/department/details?id=' + department.id}">detalles</a></td>
                <td><a th:href="${'/department/edit/' + department.id}">modificar</a></td>
                <td><a th:href="${'/department/delete/' + department.id}">eliminar</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${#lists.isEmpty(departmentsList)}"> No departments </div>
</div>
<footer th:replace="fragments/footer"></footer>
</body>
</html>
