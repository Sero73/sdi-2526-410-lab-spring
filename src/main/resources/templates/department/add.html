<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head"><title>Añadir Departamento</title></head>
<body>
<nav th:replace="fragments/nav"></nav>
<div class="container" id="main-container">
    <h2>Agregar nota</h2>
    <form class="form-horizontal" method="post" action="/department/add">
        <div class="form-group">
            <label class="control-label col-sm-2" for="code">Code:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="code" name="code" placeholder="Codigo departamento" required="true" />
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="name">Nombre:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="name" name="name" placeholder="Nombre departamento" required="true" />
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="faculty">Faculty:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="faculty" name="faculty" placeholder="Facultad" required="true" />
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="phone">Telefono:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="phone" name="phone" placeholder="Telefono" required="true" />
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="professors">Profesores:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="professors" name="professors" placeholder="5" required="true" />
            </div>
        </div>
        <input type="number" class="form-control" id="id" name="id" required="true" value=0 hidden="true" />

        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary">Enviar</button>
            </div>
        </div>
    </form>
</div>
<footer th:replace="fragments/footer"></footer>
</body>
</html>
